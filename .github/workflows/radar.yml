name: Kansai Radar

# Free GitHub Actions scheduling.
# NOTE: cron times are UTC and are NOT minute-exact on the free tier — the
# queue can delay a run by several minutes. We run a morning digest slot plus
# a few intraday slots for "starting soon" reminders. The auto-commit at the
# end keeps the repo active so the 60-day inactivity pause never disables cron.
on:
  schedule:
    # Every 10 minutes so button taps / commands are answered within minutes.
    # Each run is light: it only re-scrapes the sources every `collect_interval_min`
    # (default 120 min); the rest just poll Telegram and fire due reminders.
    # Public repos get free unlimited Actions minutes, so frequent runs are fine.
    # (GitHub may delay scheduled runs by a few minutes under load.)
    - cron: "*/10 * * * *"
  workflow_dispatch:        # allow manual runs from the Actions tab

# Allow the workflow to commit updated state.json and docs/ back to the repo.
permissions:
  contents: write

# Never run two cycles at once (they share state.json).
concurrency:
  group: kansai-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional: only if you have a Connpass API key. Leave unset to run keyless.
          CONNPASS_API_KEY: ${{ secrets.CONNPASS_API_KEY }}
        run: |
          # Manual runs force a digest so you can test end-to-end immediately;
          # scheduled runs keep the once-per-day gate.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m radar --once --force-digest
          else
            python -m radar --once
          fi

      - name: Commit updated state and map
        run: |
          git config user.name "kansai-radar[bot]"
          git config user.email "kansai-radar@users.noreply.github.com"
          git add state.json docs/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update radar state and map [skip ci]"
            # Retry push with simple backoff in case of transient failures.
            for attempt in 1 2 3 4; do
              if git push; then
                break
              fi
              echo "push failed (attempt $attempt); retrying..."
              sleep $((2 ** attempt))
            done
          fi
